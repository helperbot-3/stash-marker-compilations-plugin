name: Marker Compilations
description: Arrange markers into saved compilations with source playback and optional full-duration cached clips.
version: 0.20.1
url: https://github.com/helperbot-3/stash-marker-compilations-plugin
interface: raw
exec:
  - python3
  - "{pluginDir}/backend.py"
ui:
  javascript:
    - ui/patterns.js
    - ui/compilations.js
  css:
    - ui/compilations.css
  assets:
    /cache/: cache/
    /exports/: exports/
tasks:
  - name: Generate compilation clips
    description: Generate reusable full-duration clips for a saved compilation. Start this from the compilation editor.
    defaultArgs:
      action: generate

  - name: Render compilation video
    description: Render a saved snapshot into a complete video and optionally import it into Stash.
    defaultArgs:
      action: render_export
